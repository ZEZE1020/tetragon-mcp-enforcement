apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-tool-runner-egress
  namespace: mcp-demo
spec:
  endpointSelector:
    matchLabels:
      app: mcp-tool-runner
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: mcp-demo
            app: approved-backend
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
