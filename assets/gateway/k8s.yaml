apiVersion: v1
kind: Namespace
metadata:
  name: mcp-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: approved-backend
  namespace: mcp-demo
  labels:
    app: approved-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: approved-backend
  template:
    metadata:
      labels:
        app: approved-backend
    spec:
      containers:
        - name: http-echo
          image: hashicorp/http-echo:1.0.0
          args: ["-text=approved-backend:ok", "-listen=:8080"]
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: approved-backend
  namespace: mcp-demo
spec:
  selector:
    app: approved-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: mcp-demo
  labels:
    app: mcp-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-gateway
  template:
    metadata:
      labels:
        app: mcp-gateway
    spec:
      containers:
        - name: mcp-gateway
          image: mcp-gateway:local
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN_ADDR
              value: ":8090"
            - name: BACKEND_URL
              value: "http://approved-backend.mcp-demo.svc.cluster.local:8080"
          ports:
            - containerPort: 8090
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  namespace: mcp-demo
spec:
  selector:
    app: mcp-gateway
  type: NodePort
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      nodePort: 30090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tool-runner
  namespace: mcp-demo
  labels:
    app: mcp-tool-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-tool-runner
  template:
    metadata:
      labels:
        app: mcp-tool-runner
    spec:
      containers:
        - name: tool-runner
          image: curlimages/curl:8.10.1
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
