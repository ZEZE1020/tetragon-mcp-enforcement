apiVersion: v1
kind: Namespace
metadata:
  name: mcp-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: approved-backend
  namespace: mcp-demo
  labels:
    app: approved-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: approved-backend
  template:
    metadata:
      labels:
        app: approved-backend
    spec:
      containers:
        - name: approved-backend
          image: ghcr.io/zeze1020/mcp-gateway:latest
          imagePullPolicy: IfNotPresent
          args: ["--mode=backend"]
          env:
            - name: LISTEN_ADDR
              value: ":8080"
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: approved-backend
  namespace: mcp-demo
spec:
  selector:
    app: approved-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-tool-runner
  namespace: mcp-demo
  labels:
    app: mcp-tool-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-tool-runner
  template:
    metadata:
      labels:
        app: mcp-tool-runner
    spec:
      containers:
        - name: tool-runner
          image: ghcr.io/zeze1020/mcp-gateway:latest
          imagePullPolicy: IfNotPresent
          args: ["--mode=runner"]
          env:
            - name: LISTEN_ADDR
              value: ":8081"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - containerPort: 8081
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 1
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-tool-runner
  namespace: mcp-demo
spec:
  selector:
    app: mcp-tool-runner
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: mcp-demo
  labels:
    app: mcp-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-gateway
  template:
    metadata:
      labels:
        app: mcp-gateway
    spec:
      containers:
        - name: mcp-gateway
          image: ghcr.io/zeze1020/mcp-gateway:latest
          imagePullPolicy: IfNotPresent
          args: ["--mode=gateway"]
          env:
            - name: LISTEN_ADDR
              value: ":8090"
            - name: BACKEND_URL
              value: "http://approved-backend.mcp-demo.svc.cluster.local:8080"
            - name: RUNNER_URL
              value: "http://mcp-tool-runner.mcp-demo.svc.cluster.local:8081"
          ports:
            - containerPort: 8090
              name: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  namespace: mcp-demo
spec:
  selector:
    app: mcp-gateway
  type: NodePort
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      nodePort: 30090
